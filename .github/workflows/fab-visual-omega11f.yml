name: FAB.VISUAL Omega11F isolated derivative runtime witness
on:
  push:
    branches: ['feature/fab-visual-omega11f-derivative-runtime-witness']
  pull_request:
    paths:
      - 'products/fab-visual/scripts/omega11f-*.py'
      - 'products/fab-visual/tests/test_omega11f_derivative.py'
      - '.github/workflows/fab-visual-omega11f.yml'
      - 'products/fab-visual/docs/OMEGA11F_RUNTIME_DERIVATIVE_DECISION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-source-derivative-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact unmerged FAB.VISUAL research
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: fabrica
      - name: Checkout immutable original MIT Anatomy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wheresryan22/anatomy
          ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
          fetch-depth: 1
          persist-credentials: false
          path: original
      - name: Verify exact source-lock before creating any derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11f
          python3 fabrica/products/fab-visual/scripts/omega10-upstream-lock.py \
            --root original --commit 1482e8469b0a9e0d8cc18ea2740a01423d29ae80 \
            --count 173 --output evidence/omega11f/173-original-blobs.json \
            > evidence/omega11f/source-lock-status.json
          test -z "$(git -C original status --porcelain)"
          git -C fabrica rev-parse HEAD > evidence/omega11f/review-head.txt
          git -C original rev-parse HEAD > evidence/omega11f/upstream-head.txt
          { python3 --version; uname -a; } > evidence/omega11f/environment.txt
      - name: Apply only source-hashed separate HTML derivative hooks
        shell: bash
        run: |
          set -euo pipefail
          cp -a original derivative
          python3 fabrica/products/fab-visual/scripts/omega11f-derivative.py \
            --original original --derivative derivative \
            --output evidence/omega11f/DERIVATIVE_PROVENANCE.json \
            > evidence/omega11f/derivative-summary.json
          test -z "$(git -C original status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/omega11f/DERIVATIVE_PROVENANCE.json').read_text())
          assert r['source_original_untouched'] is True
          assert r['source_pin']=='1482e8469b0a9e0d8cc18ea2740a01423d29ae80'
          assert set(r['patches'])=={'raptor-light','turning-light'}
          for s,p in r['patches'].items():
              assert p['derivative_is_original'] is False
              assert p['original_html_sha256']!=p['derivative_html_sha256']
              assert p['runtime_frame_attestation']=='NOT_ADMITTED'
          assert r['release']=='HOLD'
          PY
      - name: Install independent pinned Chromium tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            'playwright==1.57.0' 'pillow==11.3.0'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run independent adversarial derivative and readout tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m unittest discover \
            -s fabrica/products/fab-visual/tests -p 'test_omega11f_derivative.py' -v \
            2>&1 | tee evidence/omega11f/adversarial-tests.log
      - name: Compare original observer-only vs derivative Chromium readout
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python fabrica/products/fab-visual/scripts/omega11f-browser-witness.py \
            --original original --derivative derivative \
            --manifest evidence/omega11f/DERIVATIVE_PROVENANCE.json \
            --output evidence/omega11f/browser \
            > evidence/omega11f/browser-status.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/omega11f/browser/OMEGA11F_RUNTIME_RECEIPT.json').read_text())
          assert len(r['observations'])==8
          assert r['processes_per_side']==2
          assert r['runtime_readout_gate']=='PASS_INSTRUMENTED_DERIVATIVE_ONLY'
          assert r['actual_renderer_frame_attestation']=='NOT_ADMITTED'
          assert r['actual_camera_projection_attestation']=='NOT_ADMITTED'
          assert r['actual_model_depth_order']=='NOT_RUN'
          assert r['historical_html_byte_parity']=='FAIL'
          assert r['historical_pixel_reproducibility']=='FAIL'
          assert r['release']=='HOLD'
          for x in r['observations']:
              assert not x['errors'] and not x['blocked_external']
              if x['side']=='original':
                  assert x['observation_classification']=='PASS_ORIGINAL_OBSERVER_ONLY'
                  assert x['original_page_had_derivative'] is False
              else:
                  assert x['observation_classification']=='PASS_INSTRUMENTED_STATE_READOUT_ONLY'
                  assert len(x['witness']['events'])>=2
                  assert x['witness']['runtime_frame_attested'] is False
          print('INSTRUMENTED_DERIVATIVE_READOUT_PASS; ACTUAL_RENDERER_ATTESTATION_NOT_ADMITTED')
          PY
          test -z "$(git -C original status --porcelain)"
      - name: Record final immutable-original and derivative hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11f
          git -C original status --porcelain > evidence/omega11f/original-status-final.txt
          find evidence/omega11f -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/omega11f/SHA256SUMS.txt
          sha256sum -c evidence/omega11f/SHA256SUMS.txt
      - name: Archive derivative evidence only, not a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega11f-source-derivative-runtime
          path: evidence/omega11f/
          retention-days: 30
          if-no-files-found: warn
