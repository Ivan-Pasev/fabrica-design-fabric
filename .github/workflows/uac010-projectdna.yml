name: FDF UAC-010 ProjectDNA local witness contract
on:
  pull_request:
    paths:
      - 'tools/fdf_projectdna.py'
      - 'registry/uac010_selected_source_refresh.json'
      - 'tests/test_uac010_*.py'
      - '.github/workflows/uac010-projectdna.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run ProjectDNA witness and source refresh regressions
        run: python -m unittest discover -s tests -p "test_uac010_*.py" -v
      - name: Recheck historical portfolio consistency (no network)
        run: python tools/fdf_portfolio.py audit
