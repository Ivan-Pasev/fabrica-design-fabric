name: FAB.VISUAL Omega11C forensic replay and process-state controls
on:
  push:
    branches: ['feature/fab-visual-omega11c-state-replay']
  pull_request:
    paths:
      - 'products/fab-visual/scripts/omega11c-*.py'
      - 'products/fab-visual/tests/test_omega11c_state_replay.py'
      - '.github/workflows/fab-visual-omega11c.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-locked-historical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fabrica
      - name: Install standalone image comparator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Reject forged evidence and state false positives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11c/offline
          .venv/bin/python -m unittest discover -s fabrica/products/fab-visual/tests \
            -p 'test_omega11c_state_replay.py' -v 2>&1 \
            | tee evidence/omega11c/offline/adversarial-tests.log
      - name: Recover both prior successful exact-head GitHub CI witnesses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in '43512578186 first' '43512537839 second'; do
            set -- $pair
            mkdir -p "evidence/omega11c/$2"
            gh run download "$1" -R "$GITHUB_REPOSITORY" \
              --name fab-visual-omega11b-pinned-paired-browser \
              --dir "evidence/omega11c/$2"
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out=Path('evidence/omega11c')
          for side in ('first','second'):
              folder=out/side
              assert (folder/'captures/OMEGA11B_BROWSER_RECEIPT.json').is_file()
              with ZipFile(out/(side+'.zip'),'w',compression=ZIP_DEFLATED) as archive:
                  for f in sorted(folder.rglob('*')):
                      if f.is_file():archive.write(f,f.relative_to(folder).as_posix())
          PY
      - name: Independently audit paired original-source screenshots across CI runs
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python fabrica/products/fab-visual/scripts/omega11c-crossrun-audit.py \
            --first evidence/omega11c/first.zip \
            --second evidence/omega11c/second.zip \
            --output evidence/omega11c/offline/crossrun \
            2>&1 | tee evidence/omega11c/offline/crossrun-status.log
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/omega11c/offline/crossrun/OMEGA11C_CROSSRUN_AUDIT.json').read_text())
          assert r['cases_checked']==18
          assert r['cross_run_pixel_reproducibility']=='FAIL'
          assert r['case_classification_mismatches']==2
          assert r['crossrun_image_drift_cases']==2
          mapping={x['case']:x for x in r['observations']}
          assert mapping['raptor-light-1280-hover_center']['side_drift']['rebuilt']['changed_pixels']==18
          assert mapping['raptor-light-1280-hover_center']['side_drift']['original']['changed_pixels']==0
          assert mapping['turning-light-390-hover_center']['side_drift']['original']['changed_pixels']==121
          assert mapping['turning-light-390-hover_center']['side_drift']['rebuilt']['changed_pixels']==0
          assert r['state_readback']=='NOT_RUN' and r['release']=='HOLD'
          print('INDEPENDENT_ARCHIVE_PARITY_DIAGNOSIS_PASS; CROSS_RUN_REPRODUCIBILITY_FAIL; RELEASE_HOLD')
          PY
      - name: Hash bounded historical audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence/omega11c/offline -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/omega11c/offline/SHA256SUMS.txt
          sha256sum -c evidence/omega11c/offline/SHA256SUMS.txt
      - name: Archive forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega11c-crossrun-forensics
          path: evidence/omega11c/offline/
          if-no-files-found: warn
          retention-days: 30

  source-locked-fresh-process-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact first-party research HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fabrica
      - name: Checkout immutable original Anatomy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wheresryan22/anatomy
          ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
          fetch-depth: 1
          persist-credentials: false
          path: pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify full source lock and isolated three-page build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11c/fresh
          python3 fabrica/products/fab-visual/scripts/omega10-upstream-lock.py \
            --root pinned --commit 1482e8469b0a9e0d8cc18ea2740a01423d29ae80 \
            --count 173 --output evidence/omega11c/fresh/173-blob-lock.json \
            > evidence/omega11c/fresh/source-status.json
          test -z "$(git -C pinned status --porcelain)"
          cp -a pinned rebuilt
          (cd rebuilt && node examples/raptor-engine/build.mjs > ../evidence/omega11c/fresh/raptor-dark.log 2>&1)
          (cd rebuilt && node examples/raptor-engine/build.mjs --light > ../evidence/omega11c/fresh/raptor-light.log 2>&1)
          (cd rebuilt && node examples/turning-dial/stress.mjs --light > ../evidence/omega11c/fresh/turning-light.log 2>&1)
          python3 fabrica/products/fab-visual/scripts/diagnose-upstream-drift.py \
            --baseline pinned --rebuilt rebuilt \
            --output evidence/omega11c/fresh/numeric-drift.json \
            > evidence/omega11c/fresh/numeric-drift-stdout.json
          { node --version; node -p process.versions.v8; python3 --version; uname -a; } \
            > evidence/omega11c/fresh/environment.txt
          git -C fabrica rev-parse HEAD > evidence/omega11c/fresh/review-head.txt
      - name: Install pinned local Chromium and Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            'playwright==1.57.0' 'pillow==11.3.0'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Replay two known transition cases in eight fresh Chromium processes
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python fabrica/products/fab-visual/scripts/omega11c-state-replay.py \
            --baseline pinned --rebuilt rebuilt \
            --output evidence/omega11c/fresh/replay \
            2>&1 | tee evidence/omega11c/fresh/replay-stdout.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/omega11c/fresh/replay/OMEGA11C_REPLAY_RECEIPT.json').read_text())
          assert r['source_pin']=='1482e8469b0a9e0d8cc18ea2740a01423d29ae80'
          assert r['process_replay_execution']=='PASS' and len(r['case_results'])==2
          assert r['processes_per_side']==2 and r['capture_frames_per_process']==3
          assert r['true_camera_frame_state']=='NOT_ADMITTED'
          assert r['depth_order_oracle']=='NOT_RUN' and r['release']=='HOLD'
          for case in r['case_results']:
              assert all(len(case['attempts'][side])==2 for side in ('pinned','rebuilt'))
          print('FRESH_PROCESS_EXECUTION_PASS; CAMERA_FRAME_NOT_ADMITTED; RELEASE_HOLD')
          PY
          test -z "$(git -C pinned status --porcelain)"
      - name: Hash complete bounded replay archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence/omega11c/fresh -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > evidence/omega11c/fresh/SHA256SUMS.txt
          sha256sum -c evidence/omega11c/fresh/SHA256SUMS.txt
      - name: Archive fresh process replay observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega11c-fresh-browser-processes
          path: evidence/omega11c/fresh/
          if-no-files-found: warn
          retention-days: 30
