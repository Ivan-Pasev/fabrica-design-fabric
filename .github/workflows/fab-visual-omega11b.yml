name: FAB.VISUAL Omega11B paired Chromium source-drift witness
on:
  push:
    branches: ['feature/fab-visual-omega11b-browser-drift']
  pull_request:
    paths:
      - 'products/fab-visual/scripts/omega11b-browser-parity.py'
      - 'products/fab-visual/tests/test_omega11b_browser.py'
      - '.github/workflows/fab-visual-omega11b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-original-and-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Review exact unmerged FAB.VISUAL source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fabrica
      - name: Acquire immutable original Anatomy separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wheresryan22/anatomy
          ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
          persist-credentials: false
          fetch-depth: 1
          path: pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify whole upstream source and preserve fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11b
          python3 fabrica/products/fab-visual/scripts/omega10-upstream-lock.py \
            --root pinned \
            --commit 1482e8469b0a9e0d8cc18ea2740a01423d29ae80 \
            --count 173 \
            --output evidence/omega11b/original-173-source-lock.json \
            > evidence/omega11b/source-status.json
          test -z "$(git -C pinned status --porcelain)"
          { node --version; node -p "process.versions.v8"; python3 --version; uname -a; } \
            > evidence/omega11b/environment.txt
          git -C fabrica rev-parse HEAD > evidence/omega11b/review-head.txt
          git -C pinned rev-parse HEAD > evidence/omega11b/original-head.txt
      - name: Rebuild only three known drifted HTML pages in isolated copy
        shell: bash
        run: |
          set -euo pipefail
          cp -a pinned rebuilt
          (cd rebuilt && node examples/raptor-engine/build.mjs \
            > ../evidence/omega11b/raptor-dark.log 2>&1)
          (cd rebuilt && node examples/raptor-engine/build.mjs --light \
            > ../evidence/omega11b/raptor-light.log 2>&1)
          (cd rebuilt && node examples/turning-dial/stress.mjs --light \
            > ../evidence/omega11b/turning-light.log 2>&1)
          python3 fabrica/products/fab-visual/scripts/diagnose-upstream-drift.py \
            --baseline pinned --rebuilt rebuilt \
            --output evidence/omega11b/numeric-drift.json \
            > evidence/omega11b/numeric-drift-stdout.json
          git -C pinned status --porcelain > evidence/omega11b/original-status.txt
          test ! -s evidence/omega11b/original-status.txt
      - name: Install pinned independent screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            'playwright==1.57.0' 'pillow==11.3.0'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Unit-test evidence classifier and source integrity guards
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m unittest discover \
            -s fabrica/products/fab-visual/tests -p 'test_omega11b_browser.py' -v \
            2>&1 | tee evidence/omega11b/synthetic-tests.log
      - name: Execute source-locked paired Chromium viewport observations
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python fabrica/products/fab-visual/scripts/omega11b-browser-parity.py \
            --baseline pinned --rebuilt rebuilt --output evidence/omega11b/captures \
            > evidence/omega11b/browser-summary.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/omega11b/captures/OMEGA11B_BROWSER_RECEIPT.json')
          j=json.loads(p.read_text())
          assert j['source_pin']=='1482e8469b0a9e0d8cc18ea2740a01423d29ae80'
          assert j['completed_cases']==18 and j['observation_coverage']=='EXECUTED'
          assert j['strict_generated_byte_parity']=='FAIL'
          assert j['visible_equivalence']=='NOT_ADMITTED'
          assert j['discrete_occlusion_equivalence']=='NOT_RUN'
          assert j['release']=='HOLD'
          print('OBSERVATION_EXECUTION_PASS; FULL_EQUIVALENCE_NOT_ADMITTED; RELEASE_HOLD')
          PY
          git -C pinned status --porcelain > evidence/omega11b/original-status-final.txt
          test ! -s evidence/omega11b/original-status-final.txt
      - name: Hash every evidence member
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11b
          find evidence/omega11b -type f ! -name EVIDENCE-SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > evidence/omega11b/EVIDENCE-SHA256SUMS.txt
          sha256sum -c evidence/omega11b/EVIDENCE-SHA256SUMS.txt
      - name: Archive bounded browser evidence, never a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega11b-pinned-paired-browser
          path: evidence/omega11b/
          retention-days: 30
          if-no-files-found: warn
