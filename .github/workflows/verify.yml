name: FDF first-party source and KBI preview verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify original public first-party skill contracts
        run: python3 tools/validate_preview.py
      - name: Verify Kernel-Based Intelligence and caller-workspace bootstrap
        run: python3 tools/validate_kernelbased.py
