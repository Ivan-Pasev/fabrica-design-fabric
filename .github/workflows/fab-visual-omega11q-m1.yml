name: FAB.VISUAL Omega11Q M1 fixed synthetic model evaluator
on:
  push:
    branches: ['feature/fab-visual-omega11q-m1-independent-evaluator']
  pull_request:
    paths:
      - 'products/fab-visual/src/visual/independent-model-evaluator.mjs'
      - 'products/fab-visual/tests/independent-model-evaluator.test.mjs'
      - 'products/fab-visual/fixtures/independent-microgrid.synthetic.json'
      - 'products/fab-visual/docs/OMEGA11Q_M1_*.md'
      - '.github/workflows/fab-visual-omega11q-m1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-node-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0','22.16.0']
    steps:
      - name: Exact candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin tested Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Obtain original MIT Anatomy at pinned immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wheresryan22/anatomy
          ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
          path: original
          persist-credentials: false
          fetch-depth: 1
      - name: Original 173-object source attestation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11q-m1
          git rev-parse HEAD > evidence/omega11q-m1/candidate-commit.txt
          node --version > evidence/omega11q-m1/node-version.txt
          python3 products/fab-visual/scripts/omega10-upstream-lock.py \
            --root original --commit 1482e8469b0a9e0d8cc18ea2740a01423d29ae80 \
            --count 173 --output evidence/omega11q-m1/anatomy-original-173.json \
            > evidence/omega11q-m1/source-lock-report.json
          test -z "$(git -C original status --porcelain)"
      - name: All inherited Node regressions, M1 negative controls and ancestry check
        shell: bash
        run: |
          set -euo pipefail
          cd products/fab-visual
          node bin/fab-visual.mjs anatomy-verify > ../../evidence/omega11q-m1/subset-source-lock.json
          node --test tests/*.test.mjs 2>&1 | tee ../../evidence/omega11q-m1/all-tests.log
      - name: Independently executed first-party synthetic equation report
        shell: bash
        run: |
          set -euo pipefail
          cd products/fab-visual
          node --input-type=module <<'JS' > ../../evidence/omega11q-m1/model-evaluation.json
          import {readFileSync} from 'node:fs';
          import {evaluateIndependentMicrogrid} from './src/visual/independent-model-evaluator.mjs';
          const scene=JSON.parse(readFileSync('templates/energy-microgrid.scene.json','utf8'));
          const spec=JSON.parse(readFileSync('fixtures/independent-microgrid.synthetic.json','utf8'));
          const r=evaluateIndependentMicrogrid(scene,spec);
          if(r.status!=='PASS_BOUNDED_SYNTHETIC_EQUATION' ||
             r.renderedReadout.status!=='NOT_RUN' ||
             r.release!=='HOLD' || r.physicalValidation!=='NOT_RUN')
            process.exit(2);
          process.stdout.write(JSON.stringify(r,null,2)+'\n');
          JS
      - name: Fail-closed release gate remains blocked
        shell: bash
        run: |
          set -euo pipefail
          cd products/fab-visual
          if node bin/fab-visual.mjs gate examples/codexstation-policy/manifest.json; then
            echo "UNEXPECTED RELEASE OPEN" && exit 1
          fi
          test -z "$(git -C ../../original status --porcelain)"
      - name: Evidence hash manifest and upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11q-m1
          find evidence/omega11q-m1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/omega11q-m1/SHA256SUMS.txt
          sha256sum -c evidence/omega11q-m1/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fab-visual-omega11q-m1-node-${{ matrix.node }}
          path: evidence/omega11q-m1/
          if-no-files-found: warn
          retention-days: 30
  inherited-offline-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Generate existing offline Gallery and three synthetic Studios
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11q-m1/browser
          cd products/fab-visual
          node bin/fab-visual.mjs gallery ../../evidence/omega11q-m1/browser/gallery \
            > ../../evidence/omega11q-m1/browser/gallery-summary.json
      - name: Pinned browser harness for inherited offline ZIP-import replay
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python products/fab-visual/scripts/gallery-browser-smoke.py \
            --gallery evidence/omega11q-m1/browser/gallery \
            --output evidence/omega11q-m1/browser/gallery-qa \
            > evidence/omega11q-m1/browser/gallery-qa-summary.json
          .venv/bin/python products/fab-visual/scripts/project-import-browser-smoke.py \
            --gallery evidence/omega11q-m1/browser/gallery \
            --output evidence/omega11q-m1/browser/import-qa \
            > evidence/omega11q-m1/browser/import-qa-summary.json
      - name: Produce bounded browser evidence checksums
        if: always()
        run: |
          mkdir -p evidence/omega11q-m1/browser
          find evidence/omega11q-m1/browser -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/omega11q-m1/browser/SHA256SUMS.txt
          sha256sum -c evidence/omega11q-m1/browser/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fab-visual-omega11q-m1-browser
          path: evidence/omega11q-m1/browser/
          if-no-files-found: warn
          retention-days: 30
