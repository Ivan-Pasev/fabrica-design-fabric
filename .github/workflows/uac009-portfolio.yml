name: UAC-009 external-source portfolio contract
on:
  pull_request:
    paths:
      - 'registry/third_party_sources.v1.json'
      - 'registry/portfolio_admission_protocol.v1.json'
      - 'tools/fdf_portfolio.py'
      - 'tests/test_uac009_portfolio.py'
      - 'skills/fdf-upstream-portfolio/**'
      - '.github/workflows/uac009-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Static portfolio contract and negative authorization tests
        run: python -m unittest discover -s tests -p test_uac009_portfolio.py -v
      - name: Read-only audit and fit
        run: |
          python tools/fdf_portfolio.py audit
          python tools/fdf_portfolio.py fit --intent motion --limit 30
          python tools/fdf_portfolio.py fit --intent components --limit 30
