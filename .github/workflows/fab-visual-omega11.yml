name: FAB.VISUAL Omega11 independent static 3D clearance oracle
on:
  push:
    branches: ['feature/fab-visual-omega11-world-clearance']
  pull_request:
    paths:
      - 'products/fab-visual/scripts/world-clearance-omega11.py'
      - 'products/fab-visual/tests/test_omega11_clearance.py'
      - '.github/workflows/fab-visual-omega11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-geometry-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Environment and synthetic test execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega11
          python3 --version | tee evidence/omega11/python-version.txt
          uname -a > evidence/omega11/runner.txt
          python3 -m unittest discover -s products/fab-visual/tests -p 'test_omega11_clearance.py' -v \
            2>&1 | tee evidence/omega11/tests.log
          git status --porcelain > evidence/omega11/worktree-status.txt
          find evidence/omega11 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum \
            > evidence/omega11/SHA256SUMS
          sha256sum -c evidence/omega11/SHA256SUMS
      - name: Upload synthetic scope evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega11-synthetic-3d-clearance
          path: evidence/omega11/
          if-no-files-found: warn
          retention-days: 30
