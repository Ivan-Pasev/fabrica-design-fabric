name: FDF UAC-013 evidence intake hardening
on:
  pull_request:
    paths:
      - 'tools/fdf_host_evidence.py'
      - 'tests/test_uac012_admission.py'
      - 'docs/UAC013_EVIDENCE_HARDENING.md'
      - '.github/workflows/uac013-evidence-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-evidence-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run UAC-012/013 fail-closed admission tests
        run: python -m unittest discover -s tests -p test_uac012_admission.py -v
