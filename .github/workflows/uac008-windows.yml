name: FDF UAC-008 Windows transaction smoke (review only)
on:
  pull_request:
    paths:
      - 'distribution/uac-v0.2/**'
      - 'research/uac008/**'
      - 'tests/test_uac008_transaction.py'
      - '.github/workflows/uac008-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-transaction:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run 12 native Windows transaction regressions (symlink-dependent case excluded)
        shell: pwsh
        run: python research/uac008/windows_smoke.py
