name: FDF UAC-014 privacy-minimized owner status
on:
  pull_request:
    paths:
      - 'tools/fdf_owner_status.py'
      - 'tests/test_uac014_owner_status.py'
      - 'docs/UAC014_REAL_PROJECT_STATUS.md'
      - '.github/workflows/uac014-owner-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-status-source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run source-only owner status privacy and denial tests
        run: python -m unittest discover -s tests -p test_uac014_owner_status.py -v
      - name: Real repository read-only status; NOT native IDE evidence
        run: python tools/fdf_owner_status.py status --project . --host unknown --intent design
