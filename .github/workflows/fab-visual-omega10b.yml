name: FAB.VISUAL Omega10B upstream HTML drift classification
on:
  push:
    branches: ['feature/fab-visual-omega10b-repro-diagnosis']
  pull_request:
    paths:
      - 'products/fab-visual/scripts/diagnose-upstream-drift.py'
      - 'products/fab-visual/tests/test_omega10b_drift.py'
      - '.github/workflows/fab-visual-omega10b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-serialization-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact FAB.VISUAL review head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fabrica
      - name: Checkout complete pinned original Anatomy separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wheresryan22/anatomy
          ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
          fetch-depth: 1
          persist-credentials: false
          path: pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify original tracked bytes and self-tests of drift classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega10b
          python3 fabrica/products/fab-visual/scripts/omega10-upstream-lock.py \
            --root pinned \
            --commit 1482e8469b0a9e0d8cc18ea2740a01423d29ae80 \
            --count 173 \
            --output evidence/omega10b/original-173-source-lock.json \
            > evidence/omega10b/original-source-status.json
          git -C pinned status --porcelain > evidence/omega10b/original-status-before.txt
          test ! -s evidence/omega10b/original-status-before.txt
          python3 -m unittest discover -s fabrica/products/fab-visual/tests -p 'test_omega10b_drift.py' -v \
            2>&1 | tee evidence/omega10b/diagnostic-unit-tests.log
          printf 'node=%s\n' "$(node --version)" > evidence/omega10b/environment.txt
          python3 --version >> evidence/omega10b/environment.txt
          uname -a >> evidence/omega10b/environment.txt
      - name: Build only the 3 previously divergent upstream HTML pages in a disposable copy
        shell: bash
        run: |
          set -euo pipefail
          cp -a pinned rebuilt
          cd rebuilt
          node examples/raptor-engine/build.mjs \
            > ../evidence/omega10b/raptor-dark-build.log 2>&1
          node examples/raptor-engine/build.mjs --light \
            > ../evidence/omega10b/raptor-light-build.log 2>&1
          node examples/turning-dial/stress.mjs --light \
            > ../evidence/omega10b/turning-stress-light-build.log 2>&1
      - name: Diagnose all three source-locked serialized outputs without asserting byte parity
        shell: bash
        run: |
          set -euo pipefail
          python3 fabrica/products/fab-visual/scripts/diagnose-upstream-drift.py \
            --baseline pinned --rebuilt rebuilt \
            --output evidence/omega10b/structured-drift-evidence.json \
            > evidence/omega10b/diagnosis.stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/omega10b/structured-drift-evidence.json').read_text())
          assert r['diagnostic'] in ('PASS_BOUNDED_NUMERIC_DIAGNOSIS','EXACT_PARITY')
          assert r['release']=='HOLD'
          assert len(r['files']) == 3
          if r['parity']=='FAIL':
              assert all(not entry['byte_identical'] for entry in r['files'])
              print('COMPLETE_SOURCE_TESTS_PASSED; REBUILD_BYTE_PARITY_FAIL; BOUNDED_DIAGNOSIS_PASS')
          else:
              print('COMPLETE_SOURCE_TESTS_PASSED; REBUILD_BYTE_PARITY_PASS; DIAGNOSIS_EXACT')
          PY
          git -C pinned status --porcelain > evidence/omega10b/original-status-after.txt
          test ! -s evidence/omega10b/original-status-after.txt
          git -C rebuilt status --porcelain > evidence/omega10b/copy-build-git-status.txt
          sha256sum \
            pinned/examples/raptor-engine/raptor-engine.html \
            rebuilt/examples/raptor-engine/raptor-engine.html \
            pinned/examples/raptor-engine/raptor-engine-light.html \
            rebuilt/examples/raptor-engine/raptor-engine-light.html \
            pinned/examples/turning-dial/turning-stress-light.html \
            rebuilt/examples/turning-dial/turning-stress-light.html \
            > evidence/omega10b/output-SHA256SUMS.txt
      - name: Hash immutable diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/omega10b
          find evidence/omega10b -type f ! -name 'EVIDENCE-SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/omega10b/EVIDENCE-SHA256SUMS.txt
          sha256sum -c evidence/omega10b/EVIDENCE-SHA256SUMS.txt
      - name: Preserve scope-locked diagnosis, never a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fab-visual-omega10b-upstream-numeric-drift-evidence
          path: evidence/omega10b/
          if-no-files-found: warn
          retention-days: 30
